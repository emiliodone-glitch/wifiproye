# Instalación con un solo comando:   ./configurar.sh   y luego   docker compose up -d
services:
  portal:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/registros.db
    volumes:
      - ./data:/app/data

  # Caddy publica el portal con HTTPS automático (certificado gratis de Let's Encrypt).
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on: [portal]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data
      - caddy_config:/config

volumes:
  caddy_datos:
  caddy_config:
